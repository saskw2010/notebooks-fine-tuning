generation_policy:
  per_concept_minimum_tasks:
    explain: 2
    qa: 3
    compare: 1
    scenario_reasoning: 2
    error_detection: 1
    mitigation: 1
  language_mix:
    english: 0.55
    arabic: 0.25
    bilingual: 0.20
  difficulty_mix:
    foundation: 0.35
    intermediate: 0.40
    advanced: 0.25
  source_policy:
    require_provenance: true
    require_deduplication: true
    synthetic_must_be_tagged: true
    verification_required_for_eval_split: true
  split_policy:
    train: 0.90
    validation: 0.05
    test: 0.05
    split_by_source_family: true
    prevent_near_duplicate_cross_split: true

router_research_policy:
  domain_labels_are_metadata_only: true
  hard_domain_to_expert_mapping: false
  collect_router_telemetry_by:
    - science
    - discipline
    - topic
    - task_type
    - language
    - difficulty
  goals:
    - detect_emergent_specialization
    - detect_expert_collapse
    - measure_cross_domain_expert_sharing
    - compare_router_variants_under_identical_data
