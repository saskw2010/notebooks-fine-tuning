version: 0.1
project: MK7NMoE
science_id: cybersecurity
science_name: Cybersecurity
scope: defensive_and_educational
purpose: >-
  Machine-readable science tree for curriculum coverage, dataset generation,
  teacher expansion, validation, and router/expert telemetry. Domain labels are
  metadata for analysis; they must not hard-route tokens to experts.

metadata_schema:
  required_fields:
    - science
    - discipline
    - topic
    - concept
    - aki_type
    - task_type
    - source_id
    - provenance
    - synthetic
    - verified
  optional_fields:
    - difficulty
    - language
    - prerequisites
    - learning_objective
    - quality_score
    - safety_scope

aki_types:
  - definition
  - fact
  - principle
  - mechanism
  - procedure
  - comparison
  - failure_mode
  - diagnostic_signal
  - mitigation
  - policy_rule
  - tool_semantics
  - scenario

task_types:
  - explain
  - qa
  - compare
  - classify
  - reason
  - sequence_steps
  - detect_error
  - diagnose
  - choose_mitigation
  - structured_output
  - tool_call
  - summarize
  - generate_checklist
  - evaluate_claim

science_tree:
  - discipline_id: foundations
    name: Security Foundations
    topics:
      - topic_id: cia_and_risk
        name: CIA Triad and Risk
        concepts:
          - concept_id: confidentiality
            name: Confidentiality
            learning_objectives:
              - distinguish confidentiality from privacy and secrecy
              - identify controls that protect confidentiality
            aki_types: [definition, principle, scenario, mitigation]
          - concept_id: integrity
            name: Integrity
            learning_objectives:
              - explain data integrity and unauthorized modification
              - distinguish integrity controls from availability controls
            aki_types: [definition, principle, scenario, mitigation]
          - concept_id: availability
            name: Availability
            learning_objectives:
              - explain availability and resilience
              - identify single points of failure
            aki_types: [definition, principle, failure_mode, mitigation]
          - concept_id: risk_model
            name: Threat, Vulnerability, Likelihood, Impact, Risk
            learning_objectives:
              - distinguish threat, vulnerability, exploit, exposure, and risk
              - reason about qualitative risk
            aki_types: [definition, comparison, principle, scenario]
      - topic_id: security_controls
        name: Security Controls
        concepts:
          - concept_id: preventive_detective_corrective
            name: Preventive, Detective, Corrective Controls
            aki_types: [definition, comparison, scenario]
          - concept_id: administrative_technical_physical
            name: Administrative, Technical, Physical Controls
            aki_types: [definition, comparison, scenario]
          - concept_id: defense_in_depth
            name: Defense in Depth
            aki_types: [principle, mechanism, scenario, mitigation]
          - concept_id: least_privilege
            name: Least Privilege
            aki_types: [principle, procedure, failure_mode, mitigation]
          - concept_id: zero_trust
            name: Zero Trust Principles
            aki_types: [principle, comparison, scenario]

  - discipline_id: identity_access
    name: Identity and Access Management
    topics:
      - topic_id: authentication
        name: Authentication
        concepts:
          - concept_id: factors
            name: Authentication Factors
            aki_types: [definition, comparison, scenario]
          - concept_id: mfa
            name: Multi-Factor Authentication
            aki_types: [principle, mechanism, failure_mode, mitigation]
          - concept_id: password_storage
            name: Password Storage and Hashing
            aki_types: [principle, mechanism, failure_mode, mitigation]
      - topic_id: authorization
        name: Authorization
        concepts:
          - concept_id: rbac
            name: Role-Based Access Control
            aki_types: [definition, mechanism, scenario, policy_rule]
          - concept_id: abac
            name: Attribute-Based Access Control
            aki_types: [definition, mechanism, comparison, policy_rule]
          - concept_id: access_review
            name: Access Reviews and Recertification
            aki_types: [procedure, policy_rule, failure_mode]
      - topic_id: privileged_access
        name: Privileged Access Management
        concepts:
          - concept_id: privileged_accounts
            name: Privileged Accounts
            aki_types: [definition, failure_mode, mitigation]
          - concept_id: just_in_time_access
            name: Just-in-Time Privilege
            aki_types: [principle, mechanism, procedure]

  - discipline_id: network_security
    name: Network Security
    topics:
      - topic_id: network_fundamentals
        name: Network Security Fundamentals
        concepts:
          - concept_id: segmentation
            name: Network Segmentation
            aki_types: [principle, mechanism, scenario, mitigation]
          - concept_id: firewall_policy
            name: Firewall Policy Concepts
            aki_types: [definition, policy_rule, scenario, diagnostic_signal]
          - concept_id: secure_protocols
            name: Secure Protocol Selection
            aki_types: [comparison, principle, failure_mode]
      - topic_id: monitoring
        name: Network Monitoring
        concepts:
          - concept_id: ids_ips
            name: IDS and IPS
            aki_types: [definition, comparison, diagnostic_signal, scenario]
          - concept_id: network_telemetry
            name: Flows, Logs, and Packet Metadata
            aki_types: [definition, tool_semantics, diagnostic_signal]
          - concept_id: anomaly_detection
            name: Network Anomaly Detection
            aki_types: [principle, diagnostic_signal, failure_mode]

  - discipline_id: endpoint_security
    name: Endpoint and Host Security
    topics:
      - topic_id: hardening
        name: System Hardening
        concepts:
